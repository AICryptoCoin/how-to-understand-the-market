<svg viewBox="0 0 860 520" role="img" aria-labelledby="figz02t figz02d">
<title id="figz02t">Оценённое место каждого из двенадцати звеньев по циклам против места, постулированного книгой</title>
<desc id="figz02d">По вертикали — двенадцать звеньев в том порядке, в котором их перечисляет книга, сверху вниз от NAHB до Core CPI. По горизонтали — место, которое звено фактически заняло по дате разворота внутри окна цикла, от первого слева до двенадцатого справа. Каждая точка — один цикл, крупный ромб — медиана по циклам. Диагональ означала бы полное совпадение с книгой. Разброс точек по горизонтали для большинства звеньев перекрывает половину шкалы: место звена меняется от цикла к циклу сильнее, чем расстояние между соседними звеньями.</desc>
