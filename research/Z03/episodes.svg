<svg viewBox="0 0 880 334" role="img" aria-labelledby="figz03t figz03d">
<title id="figz03t">Эпизоды инверсии спреда десятилетних к трёхмесячным и их исход</title>
<desc id="figz03d">Горизонтальная временная ось по годам. Каждый эпизод инверсии — отдельная строка: отрезок начинается в месяце сигнала. У верных срабатываний отрезок заканчивается кружком в месяце пика по датировке NBER, и его длина есть лаг. У ложных тревог отрезок протянут на всё окно ожидания длиной 24 месяцев и заканчивается крестом: пика в окне не случилось. Всего строк 6, из них верных срабатываний 4, ложных тревог 2.</desc>
