<svg viewBox="0 0 860 460" role="img" aria-labelledby="figz01t figz01d">
<title id="figz01t">Взаимная корреляция NAHB HMI с безработицей и с доходностью десятилетних по лагам</title>
<desc id="figz01d">По горизонтали — на сколько месяцев NAHB сдвинут вперёд относительно второго ряда, от нуля до тридцати шести. По вертикали — коэффициент корреляции годовых приращений. Кривая для безработицы отрицательна на всём диапазоне и достигает минимума около семнадцатого месяца, а не десятого; вокруг минимума она почти плоская. Кривая для доходности десятилетних положительна после восьмого месяца и достигает максимума на восемнадцатом.</desc>
